apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: llm-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_DB, value: llm_gateway}
            - {name: POSTGRES_USER, value: llm}
            - {name: POSTGRES_PASSWORD, value: llm}
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: llm-platform}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
